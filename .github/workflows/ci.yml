name: CI

# 最小门禁：单元测试（含 GLSL 编译回归）+ 冒烟。
# smoke 在本机没有 WE 场景时会 SKIP（退出码 0），所以 CI 上不会假红。
# 想跑真渲染，可在仓库 Secrets/Variables 里提供场景（当前不上传任何 WE 资产）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 仓库不含 lockfile ⇒ 用 install（可选依赖 supreium-headless-gl 在 CI 上装不上也正常，
      # 它是 optionalDependencies，失败不影响 CPU 路径）
      - run: npm install --no-audit --no-fund --omit=optional
      - name: 单元测试
        run: npm run units
      - name: 冒烟（无场景则 SKIP）
        run: npm run smoke
      - name: 打包自检（确认发布内容完整）
        run: npm pack --dry-run
